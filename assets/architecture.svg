<path d="M288 236 L352 236" fill="none" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M288 318 L320 318 L320 268 L352 268" fill="none" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M608 200 L640 200 L640 157 L672 157" fill="none" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M608 258 L640 258 L640 273 L672 273" fill="none" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="392" width="912" height="124" rx="12" fill="none" stroke="#3a3f5c" stroke-dasharray="4 4"/>
<text x="922" y="412" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#7c869f" text-anchor="end">GENERATION FALLBACK CHAIN  (FIRST SUCCESS WINS)</text>
<rect x="48" y="424" width="200" height="72" rx="10" fill="#23273b" stroke="#6366f1" stroke-width="1.5"/>
<rect x="48" y="434" width="3" height="52" rx="1.5" fill="#a5b4fc"/>
<text x="64" y="450" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="start">1. Hugging Face</text>
<text x="64" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">Vercel function /api/generate</text>
<text x="64" y="488" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">only if HF_TOKEN is set</text>
<rect x="276" y="424" width="200" height="72" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="292" y="450" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">2. Pollinations.ai</text>
<text x="292" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">same function, flux model</text>
<text x="292" y="488" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">2 attempts, new seed each</text>
<rect x="504" y="424" width="200" height="72" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="520" y="450" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">3. Pollinations.ai</text>
<text x="520" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">called from the browser</text>
<text x="520" y="488" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">2 attempts</text>
<rect x="732" y="424" width="180" height="72" rx="10" fill="#1e2132" stroke="#3a3f5c" stroke-width="1"/>
<text x="748" y="450" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e8f0" text-anchor="start">4. Bundled sample</text>
<text x="748" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">one of 6 images in</text>
<text x="748" y="488" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3acc2" text-anchor="start">public/samples</text>
